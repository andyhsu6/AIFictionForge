name: i18n Key Integrity Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  i18n-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend package-lock exists
        run: test -f frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check i18n extraction (zero diff)
        working-directory: frontend
        run: npm run i18n:extract:ci

      - name: Check i18n TypeScript definitions (zero diff)
        working-directory: frontend
        run: npm run i18n:types:ci

      - name: Check zh/en locale key parity
        working-directory: frontend
        run: node scripts/check-locale-parity.mjs
