name: i18n Key Integrity Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  i18n-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend package-lock exists
        run: test -f frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check i18n extraction (zero diff)
        working-directory: frontend
        run: npm run i18n:extract:ci

      - name: Check i18n TypeScript definitions (zero diff)
        working-directory: frontend
        run: npm run i18n:types:ci

      - name: Check zh/en locale key parity
        working-directory: frontend
        run: node scripts/check-locale-parity.mjs

      # todo 26: runtime i18n integrity suite (node:test orphans + vitest),
      # incl. the full-route render smoke (CJK-leak + missing-key scans),
      # language-sync contract, SSE/task error contract and antd/dayjs checks.
      # Deferred from todo25's CI step on purpose: it needs the whole suite to
      # exist first (this file).
      - name: Run i18n integrity test suite
        working-directory: frontend
        run: npm test
